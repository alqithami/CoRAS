adapter_lr: 0.001
weight_decay: 0.0001
alpha: 0.1
tune_frac: 0.15
calib_frac: 0.25
test_frac: 0.25
include_remaining_target_in_train: false
torch_threads: 4
methods:
- top1_singleton
- topk_calibrated
- vanilla_conformal
- aps_conformal
- temperature_conformal
- prompt_only_top1
- coras
- coras_aps
- mondrian_domain
