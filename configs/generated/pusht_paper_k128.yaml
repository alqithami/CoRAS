seed: 0
data_path: data/pusht_visual_shift_k128.npz
output_dir: results/pusht_paper_k128
target_domains:
- pusht_shift_lighting
- pusht_shift_camera_crop
- pusht_shift_occlusion
- pusht_shift_blur_noise
image_size: 96
batch_size: 128
num_workers: 0
encoder: resnet18
pretrained: true
adapter_rank: 32
freeze_encoder_from_start: true
target_prompt_tuning: true
epochs: 8
adapter_epochs: 5
