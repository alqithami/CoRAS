seed: 0
data_path: data/droid100_visual_shift_k64.npz
output_dir: results/droid100_paper_k64
target_domains:
- droid_shift_lighting
- droid_shift_camera_crop
- droid_shift_occlusion
- droid_shift_blur_noise
image_size: 96
batch_size: 64
num_workers: 0
encoder: resnet18
pretrained: true
adapter_rank: 32
freeze_encoder_from_start: true
target_prompt_tuning: true
epochs: 8
adapter_epochs: 5
lr: 0.0003
adapter_lr: 0.001
weight_decay: 0.0001
alpha: 0.1
tune_frac: 0.15
calib_frac: 0.25
test_frac: 0.25
include_remaining_target_in_train: false
torch_threads: 4
methods:
- top1_singleton
- topk_calibrated
- vanilla_conformal
- aps_conformal
- temperature_conformal
- prompt_only_top1
- coras
- coras_aps
- mondrian_domain
